name: Cleanup non-master branches once

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git ls-remote --heads "$remote" | awk '{sub("refs/heads/", "", $2); print $2}' | while read -r branch; do
            if [ "$branch" != "master" ]; then
              echo "Deleting $branch"
              git push "$remote" --delete "$branch"
            fi
          done

# One-shot maintenance workflow. Remove after branch cleanup completes.
