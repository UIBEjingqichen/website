name: Source Media Visual Audit

on:
  push:
    branches: [v3-product-range-pages]
    paths:
      - '.github/workflows/media-audit.yml'
      - 'tools/build_media_audit_contact_sheets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build media inventory and contact sheets
        run: python tools/build_media_audit_contact_sheets.py

      - name: Upload media audit
        uses: actions/upload-artifact@v4
        with:
          name: source-media-audit
          path: tmp/media-audit
          retention-days: 7
