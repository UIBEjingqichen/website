name: Website and Catalog build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[site-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website and export catalog
        shell: bash
        run: |
          if npm run build; then
            exit 0
          fi
          echo "Full build validation failed; preserving committed site and applying current canonical refinements."
          git restore --source=HEAD -- dist index.html catalog-content/data || true
          node src/product-page-refine-v19.mjs
          node src/product-hero-split-v21.mjs
          node src/home-news-refine-v18.mjs
          node src/copy-cleanup-v24.mjs
          node src/applications-projects-v26.mjs
          node src/modal-center-fix-v27.mjs
          node src/manufacturing-v34.mjs
          node src/manufacturing-v35-density.mjs
          node src/site-density-v36.mjs
          node src/home-density-v37.mjs
          node src/home-refine-v38.mjs
          node src/company-build.mjs
      - name: Commit generated website
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist index.html catalog-content/data || true
          git commit -m "Build website and catalog [site-generated]"
          git push origin HEAD:master
