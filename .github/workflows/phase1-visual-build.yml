name: Phase 1 visual build validation

on:
  push:
    branches: [visual-system-phase1-20260906]

permissions:
  contents: write

concurrency:
  group: phase1-visual-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[site-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase-one branch
        uses: actions/checkout@v4
        with:
          ref: visual-system-phase1-20260906
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build website and catalog
        run: npm run build

      - name: Validate generated website
        run: npm run check

      - name: Commit generated phase-one pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+UIBEjingqichen@users.noreply.github.com"
          git add dist index.html catalog-content/data || true
          git commit -m "Build phase-one visual system [site-generated]"
          git push origin HEAD:visual-system-phase1-20260906
