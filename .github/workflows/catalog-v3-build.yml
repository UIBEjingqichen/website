name: Catalog V3 branch build

on:
  push:
    branches:
      - catalog-website-v3-20260828

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-v3-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: catalog-website-v3-20260828
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website and catalog
        run: npm run build
      - name: Commit generated website
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist catalog-content/data || true
          git commit -m "Build website and catalog V3 [catalog-v3-generated]"
          git push origin HEAD:catalog-website-v3-20260828
