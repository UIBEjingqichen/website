name: Temporary Catalog Export

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'tmp/catalog-pdf-export-20260825'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF asset tools
        run: python -m pip install --disable-pip-version-check pymupdf pillow

      - name: Organize certificate assets
        run: python src/certificate-assets-build.py

      - name: Build static website
        run: npm run build

      - name: Upload catalog preview
        uses: actions/upload-artifact@v4
        with:
          name: catalog-export-preview
          path: dist
          if-no-files-found: error
