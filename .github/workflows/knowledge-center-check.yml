name: Website Build Check

on:
  push:
    branches: [master, v3-product-range-pages]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF asset tools
        run: python -m pip install --disable-pip-version-check pymupdf pillow

      - name: Organize certificate assets
        run: python src/certificate-assets-build.py

      - name: Build static website
        run: npm run build

      - name: Validate generated website
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/products.html
          test -f dist/manufacturing.html
          test -f dist/about.html
          test -f dist/applications.html
          test -f dist/catalog.html
          test -f dist/assets/css/site-v3-upgrade.css
          test -f dist/product-range-pages.json
          test -f dist/knowledge/index.html
          test -f source-media/catalog-assets/manifest.json
          test -d source-media/catalog-v3

          grep -q 'Standalone pages for every catalog platform' dist/products.html
          grep -q 'Five clear routes into the portfolio' dist/products.html
          grep -q 'Power Transformers' dist/products.html
          grep -q 'Distribution Transformers' dist/products.html
          grep -q 'Dry-Type Transformers' dist/products.html
          grep -q 'Prefabricated Substations' dist/products.html
          grep -q 'Special & Renewable Solutions' dist/products.html
          ! grep -q 'Separate published capability from proven evidence' dist/products.html

          test -f dist/products/35kv-power-transformer/index.html
          test -f dist/products/66kv-power-transformer/index.html
          test -f dist/products/110kv-power-transformer/index.html
          test -f dist/products/220kv-power-transformer/index.html
          grep -q 'SZ-8000~31500/35' dist/products/35kv-power-transformer/index.html
          grep -q '8–31.5 MVA' dist/products/35kv-power-transformer/index.html
          grep -q 'SZ-6300~63000/66' dist/products/66kv-power-transformer/index.html
          grep -q '6.3–63 MVA' dist/products/66kv-power-transformer/index.html
          grep -q 'SSZ-6300~63000/110' dist/products/110kv-power-transformer/index.html
          grep -q 'SSZ-31500~240000/220' dist/products/220kv-power-transformer/index.html
          grep -q '240,000 kVA' dist/products/220kv-power-transformer/index.html

          test -f dist/products/12kv-oil-immersed-distribution-transformer/index.html
          test -f dist/products/40-5kv-renewable-oil-immersed-transformer/index.html
          test -f dist/products/dry-type-distribution-transformer/index.html
          test -f dist/products/35kv-large-dry-type-power-transformer/index.html
          test -f dist/products/zgs-prefabricated-substation/index.html
          test -f dist/products/yb-prefabricated-substation/index.html
          test -f dist/products/ybh-prefabricated-substation/index.html
          test -f dist/products/pv-ess-integrated-substation/index.html
          test -f dist/products/35-110kv-mobile-intelligent-substation/index.html
          test -f dist/products/66kv-offshore-wind-nacelle-transformer/index.html
          test -f dist/products/220kv-double-split-booster-transformer/index.html
          grep -q '0.4 / 0.415 / 0.42 kV' dist/products/12kv-oil-immersed-distribution-transformer/index.html
          grep -q '200–40,000 kVA' dist/products/zgs-prefabricated-substation/index.html
          grep -q '2,000–9,000 kVA' dist/products/pv-ess-integrated-substation/index.html

          grep -q '85,243 m²' dist/index.html
          grep -q '85,243 m²' dist/about.html
          grep -q '85,243 m²' dist/manufacturing.html
          grep -q 'RMB 250m' dist/manufacturing.html
          grep -q '>MOM<' dist/manufacturing.html
          grep -q '>SRM<' dist/manufacturing.html
          grep -q '>QMS<' dist/manufacturing.html
          grep -q '>WMS<' dist/manufacturing.html

          grep -q 'Add Technical Details' dist/index.html
          grep -q 'name="vectorGroup"' dist/index.html
          grep -q 'name="impedance"' dist/index.html
          grep -q 'name="tapChanger"' dist/index.html
          grep -q 'name="siteConditions"' dist/index.html

          ! grep -q 'images.unsplash.com' dist/products.html
          ! grep -q 'images.unsplash.com' dist/applications.html
          ! grep -q 'images.unsplash.com' dist/about.html
          grep -q 'catalog-v3/manufacturing-overview.webp' dist/manufacturing.html
          grep -q 'catalog-v3/testing-220kv-lab.webp' dist/manufacturing.html

          test -f dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html
          grep -q 'name="robots" content="noindex,follow"' dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html
          grep -q 'Product selection has moved to the product range' dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html

          grep -q 'Tianyu Electric Export Product Catalog 2026' dist/catalog.html
          test -f catalog-content/data/product-gradient.json
          grep -q 'rel="canonical"' dist/index.html

      - name: Upload generated preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist
          if-no-files-found: error

      - name: Commit generated preview and website data
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist index.html source-media/catalog-assets catalog-content/data/drawings.generated.yaml
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
          else
            git commit -m "Build V3 website preview [skip ci]"
            git push
          fi
