name: Website Build Check

on:
  push:
    branches: [master, feature/knowledge-center-v1]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF asset tools
        run: python -m pip install --disable-pip-version-check pymupdf pillow

      - name: Organize certificate assets
        run: python src/certificate-assets-build.py

      - name: Build static website
        run: npm run build

      - name: Validate generated website
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/products.html
          test -f dist/news.html
          test -f dist/catalog.html
          test -f dist/assets/css/catalog.css
          test -f dist/assets/css/catalog-enrich-v2.css
          test -f dist/assets/css/catalog-refine-v3.css
          test -f dist/assets/css/catalog-refine-v4.css
          test -f dist/knowledge/index.html
          test -f dist/knowledge/transformer-selection.html
          test -f dist/knowledge/faq/what-is-transformer-k-factor.html
          test -f dist/assets/css/knowledge.css
          test -f dist/assets/js/knowledge.js
          test -f dist/assets/css/yawei-refine.css
          test -f dist/assets/js/yawei-refine.js
          test -f dist/assets/css/visual-refine-v4.css
          test -f dist/assets/js/visual-refine-v4.js
          test -f dist/assets/css/ux-refine-v5.css
          test -f dist/assets/js/ux-refine-v5.js
          test -f dist/assets/css/ux-refine-v6.css
          test -f dist/assets/js/ux-refine-v6.js
          test -f dist/assets/css/ux-refine-v7.css
          test -f dist/assets/css/ux-refine-v8.css
          test -f dist/assets/js/ux-refine-v8.js
          test -f dist/assets/css/ux-fix-v9.css
          test -f dist/assets/knowledge-search-index.json
          test -f dist/robots.txt
          test -f source-media/catalog-assets/manifest.json
          test -d source-media/catalog-assets/images
          test -d source-media/catalog-assets/drawings
          test -d source-media/catalog-assets/certifications
          grep -q '"document_count": 20' source-media/catalog-assets/manifest.json
          grep -q 'Tianyu Export Catalog V2' dist/catalog.html
          grep -q 'catalog-refine-v3.css' dist/catalog.html
          grep -q 'catalog-refine-v4.css' dist/catalog.html
          grep -q 'This catalog is designed as an engineering sales document' dist/catalog.html
          grep -q 'Transformer products are configurable, but customization is not unlimited substitution' dist/catalog.html
          grep -q 'PRODUCT DETAILS' dist/catalog.html
          grep -q 'Tested Reference Configurations' dist/catalog.html
          grep -q 'Certificates &amp; Test Reports' dist/catalog.html
          grep -q 'Engineering Drawings' dist/catalog.html
          grep -q 'Applications &amp; Project References' dist/catalog.html
          grep -q 'catalog-project-table' dist/catalog.html
          grep -q 'oil-distribution-1600kva-type-test-p011.webp' dist/catalog.html
          grep -q 'Tay Ninh Cement Milling Plant 2' dist/catalog.html
          grep -q 'Atlantic Industrial Park 132 kV Substation' dist/catalog.html
          grep -q '24XB0336-S' dist/catalog.html
          grep -q 'ZGS22-4000/35/0.8' dist/catalog.html
          grep -q 'IP65' dist/catalog.html
          grep -q 'IP68' dist/catalog.html
          ! grep -q 'COMPLETE TECHNICAL EVIDENCE REGISTER' dist/catalog.html
          ! grep -q 'All 20 current certificate and test-report records' dist/catalog.html
          ! grep -q 'Certification &amp; Report Pages' dist/catalog.html
          ! grep -q 'Product &amp; Test Image Library' dist/catalog.html
          ! grep -q 'Engineering Drawing Library' dist/catalog.html
          ! grep -q 'Typical Application Areas' dist/catalog.html
          ! grep -q 'Built around the project' dist/catalog.html
          FAQ_COUNT=$(find dist/knowledge/faq -maxdepth 1 -name '*.html' | wc -l)
          TOPIC_COUNT=$(find dist/knowledge -maxdepth 1 -name '*.html' ! -name 'index.html' | wc -l)
          MODEL_COUNT=$(find dist/products -mindepth 2 -maxdepth 2 -name '*.html' ! -name 'index.html' | wc -l)
          test "$FAQ_COUNT" -eq 12
          test "$TOPIC_COUNT" -eq 8
          test "$MODEL_COUNT" -ge 13
          grep -q 'TRANSFORMER CUSTOMIZED ONE-STOP SOLUTION' dist/index.html
          grep -q 'EXCELLENT INDUSTRIAL LANDSCAPE' dist/index.html
          grep -q 'data-count-up' dist/index.html
          grep -q 'v5-certificate-coverflow' dist/index.html
          grep -q 'VIEW CASES' dist/index.html
          grep -q 'VIEW MANUFACTURING' dist/index.html
          grep -q 'v5-proof-grid' dist/index.html
          grep -q 'data-v6-hero' dist/index.html
          grep -q 'v7-home' dist/index.html
          grep -q 'v8-home' dist/index.html
          ! grep -q 'v6-hero-shade' dist/index.html
          grep -q 'Reference Models' dist/products.html
          grep -q 'v6-page-hero' dist/products.html
          grep -q 'v6-page-hero' dist/applications.html
          grep -q 'v6-page-hero' dist/resources.html
          grep -q 'v6-page-hero' dist/about.html
          grep -q 'v6-page-hero' dist/news.html
          grep -q 'v8-top-page' dist/products.html
          grep -q 'images.unsplash.com' dist/products.html
          grep -q 'images.unsplash.com' dist/applications.html
          grep -q 'images.unsplash.com' dist/resources.html
          grep -q 'images.unsplash.com' dist/about.html
          grep -q 'images.unsplash.com' dist/news.html
          grep -q 'European-Type Prefabricated Substation' dist/products.html
          grep -q 'Compact Prefabricated Substation' dist/products.html
          grep -q 'Pad-Mounted Transformer' dist/products.html
          grep -q 'products/oil-immersed-prefabricated-substation/index.html' dist/products.html
          ! grep -q 'href="products/oil-immersed-prefabricated-substation/"' dist/products.html
          grep -q 'v5-model-grid' dist/products/high-voltage-power-transformer/index.html
          grep -q 'v9-real-applications' dist/products/high-voltage-power-transformer/index.html
          grep -q 'BCL Hattar Line 2 7200 TPD Cement Plant' dist/products/high-voltage-power-transformer/index.html
          test -f dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html
          test -f dist/products/high-voltage-power-transformer/sfz-150000-132.html
          test -f dist/products/high-voltage-power-transformer/ssz20-240000-220.html
          test -f dist/products/high-voltage-power-transformer/ssz22-240000-220-nx1.html
          grep -q 'v6-model-gallery' dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html
          grep -q 'Documents shown below apply to this exact model only.' dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html
          grep -q 'Real Application References' dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html
          grep -q 'Atlantic Industrial Park 132 kV Substation' dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html
          grep -q 'OTHER PRODUCTS' dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html
          grep -q '../../products/oil-immersed-prefabricated-substation/index.html' dist/products/high-voltage-power-transformer/sz22-50000-110-nx1.html
          grep -q 'rel="canonical"' dist/index.html

      - name: Upload generated preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist
          if-no-files-found: error

      - name: Commit generated preview and certificate assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist index.html source-media/catalog-assets
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
          else
            git commit -m "Build website preview and certificate assets [skip ci]"
            git push
          fi
