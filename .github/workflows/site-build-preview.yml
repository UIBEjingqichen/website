name: Website preview build

on:
  push:
    branches:
      - feature/home-capabilities-project-map

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[preview-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/home-capabilities-project-map
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website
        run: npm run build
      - name: Commit generated preview
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist index.html catalog-content/data || true
          git commit -m "Build homepage capabilities preview [preview-generated]"
          git push origin HEAD:feature/home-capabilities-project-map
